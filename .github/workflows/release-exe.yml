name: Build & Release Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v3.1.0)"
        required: true
        type: string

permissions:
  contents: write   # 允许创建/更新 Release 并上传附件

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify build inputs
        shell: pwsh
        run: |
          python -m pip check
          python -m compileall -q sms\sms.pyw sms\sms_app sms\sms_core sms\sms_ui
          python -c "import serial, pystray, pyttsx3, PIL, websockets, win32api, pythoncom, pywintypes, win32com.client"
      
      - name: Run tests
        shell: pwsh
        run: |
          Write-Host "Running unit tests..." -ForegroundColor Cyan
          $env:PYTHONPATH = (Resolve-Path "sms").Path
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) {
            Write-Host "❌ Tests failed! Build aborted." -ForegroundColor Red
            exit 1
          }
          Write-Host "✅ All tests passed!" -ForegroundColor Green

      - name: Build EXE with PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --onefile `
            --windowed `
            --name "sms" `
            --icon "icon.ico" `
            --add-data "icon.ico;." `
            --paths "sms" `
            --hidden-import "pyttsx3.drivers.sapi5" `
            --hidden-import "pythoncom" `
            --hidden-import "pywintypes" `
            --hidden-import "win32com" `
            --hidden-import "win32com.client" `
            --hidden-import "sms_app" `
            --hidden-import "sms_core" `
            --hidden-import "sms_ui" `
            --collect-submodules "win32com" `
            --collect-submodules "websockets" `
            --collect-submodules "sms_app" `
            --collect-submodules "sms_core" `
            --collect-submodules "sms_ui" `
            --clean `
            sms\sms.pyw

      - name: Zip EXE
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          $zipName = "sms-$tag-win64.zip"
          Compress-Archive -Path "dist\sms.exe" -DestinationPath "dist\$zipName" -Force

      - name: Create GitHub Release & upload ZIP
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/sms-*-win64.zip
          generate_release_notes: true

          
