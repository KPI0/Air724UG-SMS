name: Build & Release Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v3.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-exe-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  APP_NAME: sms
  PYTHON_VERSION: "3.11"

jobs:
  build-release:
    name: Build Windows release
    runs-on: windows-latest

    steps:
      - name: Resolve release tag
        id: release
        shell: pwsh
        env:
          RELEASE_TAG_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          $tag = ([string]$env:RELEASE_TAG_INPUT).Trim()
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Stable release tag must use vX.Y.Z format. Got: '$tag'"
          }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Release tag: $tag"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify release version
        shell: pwsh
        run: |
          $env:PYTHONPATH = (Resolve-Path "sms").Path
          python tools/check_release_version.py "$env:RELEASE_TAG"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify build inputs
        shell: pwsh
        run: |
          python -m pip check
          python -m compileall -q sms
          python -c "import serial, pystray, pyttsx3, PIL, websockets, win32api, pythoncom, pywintypes, win32com.client"

      - name: Run tests
        shell: pwsh
        run: |
          $repoRoot = (Resolve-Path ".").Path
          $smsSrc = (Resolve-Path "sms").Path
          $env:PYTHONPATH = "$repoRoot;$smsSrc"
          if (-not (Test-Path -LiteralPath "tests" -PathType Container)) {
              throw "Required tests directory is missing. Refusing to publish an untested release."
          }
          $testFiles = @(Get-ChildItem -LiteralPath "tests" -Filter "test*.py" -File -Recurse)
          if ($testFiles.Count -eq 0) {
              throw "No test*.py files were found. Refusing to publish an untested release."
          }
          python -m unittest discover -s tests -v

      - name: Build EXE with PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --onefile `
            --windowed `
            --name "$env:APP_NAME" `
            --icon "icon.ico" `
            --add-data "icon.ico;." `
            --paths "sms" `
            --hidden-import "pyttsx3.drivers.sapi5" `
            --hidden-import "pythoncom" `
            --hidden-import "pywintypes" `
            --hidden-import "win32com" `
            --hidden-import "win32com.client" `
            --hidden-import "sms_app" `
            --hidden-import "sms_core" `
            --hidden-import "sms_ui" `
            --collect-submodules "win32com" `
            --collect-submodules "websockets" `
            --collect-submodules "sms_app" `
            --collect-submodules "sms_core" `
            --collect-submodules "sms_ui" `
            --clean `
            sms\sms.pyw

      - name: Package release files
        shell: pwsh
        run: |
          $exePath = "dist\$env:APP_NAME.exe"
          if (-not (Test-Path -LiteralPath $exePath)) {
            throw "Expected EXE was not generated: $exePath"
          }

          $zipName = "$env:APP_NAME-$env:RELEASE_TAG-win64.zip"
          $zipPath = "dist\$zipName"
          Compress-Archive -LiteralPath $exePath -DestinationPath $zipPath -Force

          $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $zipPath
          "$($hash.Hash.ToLowerInvariant())  $zipName" | Set-Content -Path "$zipPath.sha256" -Encoding ascii
      
      - name: Show build artifacts
        shell: pwsh
        run: |
          Get-ChildItem dist

      - name: Create GitHub Release and upload files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: |
            dist/${{ env.APP_NAME }}-*-win64.zip
            dist/${{ env.APP_NAME }}-*-win64.zip.sha256
          generate_release_notes: true
